<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Bridges — find your next language</title>
<meta name="description" content="Tell us what you speak. We'll show which languages will feel easiest to learn next, broken down by lexicon, grammar, phonology, and writing system.">
<script>
  (function() {
    const saved = localStorage.getItem('lb-theme');
    const useDark = saved !== 'light';
    if (useDark) document.documentElement.classList.add('dark');
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' };
</script>
<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<style>
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .chip { transition: all 0.15s; }
  .chip.selected { background: #0F6E56; color: white; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  :root { --radar-grid: #e7e5e4; --radar-label: #78716c; --radar-fill: #0F6E56; }
  .dark { --radar-grid: #44403c; --radar-label: #a8a29e; --radar-fill: #34d399; }
  .dark input[type=range] { accent-color: #34d399; }
</style>
</head>
<body class="bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-100 min-h-screen transition-colors">

<div class="max-w-5xl mx-auto px-4 py-8 md:py-12" x-data="app()" x-init="init()">

  <!-- Header -->
  <header class="mb-8 flex items-start justify-between gap-4">
    <div>
      <h1 class="text-3xl md:text-4xl font-semibold tracking-tight">Language Bridges</h1>
      <p class="mt-2 text-stone-600 dark:text-stone-400 max-w-2xl" x-html="t('subtitle')"></p>
    </div>
    <div class="flex items-center gap-2 flex-shrink-0">
      <!-- UI language selector -->
      <select
        x-model="currentLang"
        @change="saveLang()"
        :title="t('langSelector')"
        class="px-2 py-1.5 text-sm rounded-lg border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-800 text-stone-700 dark:text-stone-200 focus:outline-none focus:ring-2 focus:ring-stone-400 dark:focus:ring-stone-500 cursor-pointer"
      >
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="fr">Fran&#231;ais</option>
        <option value="es">Espa&#241;ol</option>
        <option value="it">Italiano</option>
        <option value="pl">Polski</option>
        <option value="tr">T&#252;rk&#231;e</option>
        <option value="ru">&#1056;&#1091;&#1089;&#1089;&#1082;&#1080;&#1081;</option>
      </select>
      <!-- Theme toggle -->
      <button
        @click="toggleTheme()"
        :title="isDark ? t('lightMode') : t('darkMode')"
        :aria-label="isDark ? t('lightMode') : t('darkMode')"
        class="p-2 rounded-lg border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-800 hover:bg-stone-100 dark:hover:bg-stone-700 transition-colors"
      >
        <svg x-show="isDark" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg x-show="!isDark" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Language selector (speakers) -->
  <section class="bg-white dark:bg-stone-900 rounded-xl border border-stone-200 dark:border-stone-800 p-5 md:p-6 mb-6">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-medium" x-text="t('sectionSpeaks')"></h2>
      <span class="text-sm text-stone-500 dark:text-stone-400" x-text="t('selected', {n: speakers.length})"></span>
    </div>
    <p class="text-sm text-stone-500 dark:text-stone-400 mb-4" x-text="t('hint')"></p>

    <input
      type="text"
      :placeholder="t('searchPlaceholder')"
      x-model="search"
      class="w-full px-3 py-2 rounded-lg border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-800 focus:outline-none focus:ring-2 focus:ring-stone-400 dark:focus:ring-stone-500 mb-3 text-sm"
    >

    <div class="flex flex-wrap gap-2 max-h-64 overflow-y-auto p-1">
      <template x-for="code in filteredLanguages" :key="code">
        <button
          @click="toggleSpeaker(code)"
          :class="speakers.includes(code) ? 'chip selected' : 'chip bg-stone-100 dark:bg-stone-800 hover:bg-stone-200 dark:hover:bg-stone-700 text-stone-700 dark:text-stone-200'"
          class="px-3 py-1.5 rounded-full text-sm border border-stone-300 dark:border-stone-700"
        >
          <span x-text="langName(code)"></span>
        </button>
      </template>
    </div>
  </section>

  <!-- Weights (collapsible) -->
  <section class="bg-white dark:bg-stone-900 rounded-xl border border-stone-200 dark:border-stone-800 p-5 md:p-6 mb-6">
    <details>
      <summary class="flex items-center justify-between">
        <div>
          <h2 class="text-lg font-medium" x-text="t('sectionWeights')"></h2>
          <p class="text-sm text-stone-500 dark:text-stone-400" x-text="t('weightsHint')"></p>
        </div>
        <span class="text-stone-400 dark:text-stone-500 text-sm" x-text="t('tapExpand')"></span>
      </summary>
      <div class="mt-5 grid grid-cols-1 md:grid-cols-2 gap-4">
        <template x-for="dim in weightDims" :key="dim.key">
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm text-stone-700 dark:text-stone-300" x-text="dim.label"></span>
            <input type="range" min="0" max="100" x-model.number="weights[dim.key]" class="flex-1 accent-emerald-700">
            <span class="w-10 text-right text-sm text-stone-500 tabular-nums" x-text="weights[dim.key]"></span>
          </label>
        </template>
        <button @click="resetWeights()" class="md:col-span-2 text-sm text-emerald-700 dark:text-emerald-400 hover:underline justify-self-start" x-text="t('resetWeights')"></button>
      </div>
    </details>
  </section>

  <!-- Results -->
  <section x-show="speakers.length > 0" class="space-y-3">
    <h2 class="text-lg font-medium mb-2">
      <span x-text="t('sectionResults')"></span>
      <span class="text-sm font-normal text-stone-500 dark:text-stone-400">(<span x-text="t('topN', {n: topN})"></span>)</span>
    </h2>

    <template x-for="(rec, idx) in recommendations" :key="rec.target">
      <div class="bg-white dark:bg-stone-900 rounded-xl border border-stone-200 dark:border-stone-800 p-4 md:p-5">
        <div class="flex flex-col md:flex-row md:items-start md:gap-5">

          <div class="flex items-center gap-3 md:w-56 mb-3 md:mb-0">
            <div class="flex items-center justify-center w-9 h-9 rounded-full bg-stone-100 dark:bg-stone-800 text-stone-500 dark:text-stone-400 text-sm font-medium" x-text="idx+1"></div>
            <div>
              <div class="font-medium text-stone-900 dark:text-stone-100" x-text="DATA.languages[rec.target].name"></div>
              <div class="text-xs text-stone-500 dark:text-stone-400" x-text="DATA.languages[rec.target].branch + ' \xb7 ' + DATA.languages[rec.target].family"></div>
            </div>
            <div class="ml-auto md:hidden text-2xl font-light tabular-nums" x-text="rec.total.toFixed(2)"></div>
          </div>

          <div class="hidden md:block w-32 h-32 flex-shrink-0" x-html="radarSvg(rec)"></div>

          <div class="flex-1">
            <p class="text-sm text-stone-700 dark:text-stone-300 leading-relaxed mb-3" x-text="explain(rec)"></p>
            <div class="flex flex-wrap gap-2 text-xs">
              <template x-for="dim in subscoreDims" :key="dim.key">
                <div class="px-2 py-1 rounded bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700">
                  <span class="text-stone-500 dark:text-stone-400" x-text="dim.label + ': '"></span>
                  <span class="font-medium" x-text="formatSub(rec, dim.key)"></span>
                </div>
              </template>
            </div>
          </div>

          <div class="hidden md:flex flex-col items-end ml-3">
            <div class="text-3xl font-light tabular-nums" x-text="rec.total.toFixed(2)"></div>
            <div class="text-xs text-stone-500 dark:text-stone-400" x-text="t('scorelabel')"></div>
          </div>
        </div>
      </div>
    </template>
  </section>

  <p x-show="speakers.length === 0" class="text-stone-500 dark:text-stone-400 text-sm py-12 text-center" x-text="t('noSelection')"></p>

  <footer class="mt-12 pt-6 border-t border-stone-200 dark:border-stone-800 text-xs text-stone-500 dark:text-stone-400" x-text="t('footer')"></footer>
</div>

  tr: {"de": "Almanca", "nl": "Flemenkçe", "en": "İngilizce", "af": "Afrikaanca", "yi": "Yidiş", "lb": "Lüksemburgca", "sv": "İsveççe", "no": "Norveççe", "da": "Danimarkaca", "is": "İzlandaca", "fo": "Faroece", "es": "İspanyolca", "pt": "Portekizce", "gl": "Galiçyaca", "fr": "Fransızca", "it": "İtalyanca", "ro": "Rumence", "ca": "Katalanca", "oc": "Oksitanca", "sc": "Sicilyaca", "srd": "Sarduca", "ht": "Haiti Kreolü", "ru": "Rusça", "uk": "Ukraynaca", "be": "Belarusça", "pl": "Lehçe", "cs": "Çekçe", "sk": "Slovakça", "bg": "Bulgarca", "mk": "Makedonyaca", "hr": "Hırvatça/Sırpça", "sl": "Slovence", "el": "Yunanca", "sq": "Arnavutça", "hy": "Ermenice", "lv": "Letonca", "lt": "Litvanca", "ga": "İrlandaca", "cy": "Galce", "fa": "Farsça", "tg": "Tacikçe", "ku": "Kürtçe", "ps": "Peştuca", "hi": "Hintçe", "ur": "Urduca", "bn": "Bengalce", "pa": "Pencapça", "mr": "Marathice", "gu": "Gujaratice", "ne": "Nepalce", "si": "Sinhalaca", "fi": "Fince", "et": "Estonca", "hu": "Macarca", "se": "Kuzey Laponcası", "tr": "Türkçe", "az": "Azerbaycanca", "tk": "Türkmence", "kk": "Kazakça", "ky": "Kırgızca", "tt": "Tatarca", "uz": "Özbekçe", "ug": "Uygurca", "mn": "Moğolca", "ar": "Arapça (Standart)", "he": "İbranice", "mt": "Maltaca", "am": "Amharca", "ti": "Tigrinya", "ha": "Hausaca", "so": "Somalice", "ka": "Gürcüce", "ta": "Tamilce", "te": "Teluguca", "kn": "Kannada", "ml": "Malayalam", "zh": "Mandarin Çincesi", "yue": "Kantonca", "my": "Birmanca", "bo": "Tibetçe", "ja": "Japonca", "ko": "Korece", "vi": "Vietnamca", "km": "Kmerce", "th": "Tayca", "lo": "Laosça", "id": "Endonezce", "ms": "Malayca", "tl": "Tagalogca", "jv": "Cava Dili", "sw": "Swahilice", "zu": "Zuluca", "yo": "Yorubaca", "qu": "Keçuvaca", "gn": "Guaranice", "eu": "Baskça"},
  ru: {"de": "Немецкий", "nl": "Нидерландский", "en": "Английский", "af": "Африкаанс", "yi": "Идиш", "lb": "Люксембургский", "sv": "Шведский", "no": "Норвежский", "da": "Датский", "is": "Исландский", "fo": "Фарерский", "es": "Испанский", "pt": "Португальский", "gl": "Галисийский", "fr": "Французский", "it": "Итальянский", "ro": "Румынский", "ca": "Каталанский", "oc": "Окситанский", "sc": "Сицилийский", "srd": "Сардинский", "ht": "Гаитянский креольский", "ru": "Русский", "uk": "Украинский", "be": "Белорусский", "pl": "Польский", "cs": "Чешский", "sk": "Словацкий", "bg": "Болгарский", "mk": "Македонский", "hr": "Хорватский/Сербский", "sl": "Словенский", "el": "Греческий", "sq": "Албанский", "hy": "Армянский", "lv": "Латышский", "lt": "Литовский", "ga": "Ирландский", "cy": "Валлийский", "fa": "Персидский (фарси)", "tg": "Таджикский", "ku": "Курдский", "ps": "Пушту", "hi": "Хинди", "ur": "Урду", "bn": "Бенгальский", "pa": "Панджабский", "mr": "Маратхи", "gu": "Гуджарати", "ne": "Непальский", "si": "Сингальский", "fi": "Финский", "et": "Эстонский", "hu": "Венгерский", "se": "Северносаамский", "tr": "Турецкий", "az": "Азербайджанский", "tk": "Туркменский", "kk": "Казахский", "ky": "Киргизский", "tt": "Татарский", "uz": "Узбекский", "ug": "Уйгурский", "mn": "Монгольский", "ar": "Арабский (литературный)", "he": "Иврит", "mt": "Мальтийский", "am": "Амхарский", "ti": "Тигринья", "ha": "Хауса", "so": "Сомалийский", "ka": "Грузинский", "ta": "Тамильский", "te": "Телугу", "kn": "Каннада", "ml": "Малаялам", "zh": "Мандаринский китайский", "yue": "Кантонский", "my": "Бирманский", "bo": "Тибетский", "ja": "Японский", "ko": "Корейский", "vi": "Вьетнамский", "km": "Кхмерский", "th": "Тайский", "lo": "Лаосский", "id": "Индонезийский", "ms": "Малайский", "tl": "Тагальский", "jv": "Яванский", "sw": "Суахили", "zu": "Зулу", "yo": "Йоруба", "qu": "Кечуа", "gn": "Гуарани", "eu": "Баскский"},
};
const DEFAULT_WEIGHTS = { lexical: 35, grammatical: 25, phonological: 10, writing_system: 10, genealogical: 20 };

function app() {
  return {
    DATA,
    search: '',
    speakers: ['en'].filter(c => c in DATA.languages),
    weights: {...DEFAULT_WEIGHTS},
    topN: 15,
    isDark: document.documentElement.classList.contains('dark'),
    currentLang: (function() {
      const s = localStorage.getItem('lb-lang');
      return (s && TRANSLATIONS[s]) ? s : 'en';
    })(),

    t(key, vars = {}) {
      const lang = TRANSLATIONS[this.currentLang] || TRANSLATIONS['en'];
      let str = lang[key] !== undefined ? lang[key] : (TRANSLATIONS['en'][key] || key);
      for (const [k, v] of Object.entries(vars)) {
        str = str.replaceAll('{' + k + '}', v);
      }
      return str;
    },

    saveLang() {
      localStorage.setItem('lb-lang', this.currentLang);
      document.documentElement.lang = this.currentLang;
    },

    langName(code) {
      const names = LANG_NAMES[this.currentLang];
      return (names && names[code]) ? names[code] : DATA.languages[code].name;
    },

    toggleTheme() {
      this.isDark = !this.isDark;
      if (this.isDark) {
        document.documentElement.classList.add('dark');
        localStorage.setItem('lb-theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('lb-theme', 'light');
      }
    },

    get weightDims() {
      return [
        {key:'lexical',      label: this.t('dimLexicon')},
        {key:'grammatical',  label: this.t('dimGrammar')},
        {key:'phonological', label: this.t('dimPhonology')},
        {key:'writing_system', label: this.t('dimWriting')},
        {key:'genealogical', label: this.t('dimFamily')},
      ];
    },

    get subscoreDims() {
      return [
        {key:'lexical',      label: this.t('subLex')},
        {key:'grammatical',  label: this.t('subGram')},
        {key:'phonological', label: this.t('subPhon')},
        {key:'writing_system', label: this.t('subScript')},
        {key:'genealogical', label: this.t('subFamily')},
      ];
    },

    init() {
      document.documentElement.lang = this.currentLang;
    },

    get filteredLanguages() {
      const codes = Object.keys(DATA.languages).sort((a,b)=> DATA.languages[a].name.localeCompare(DATA.languages[b].name));
      const q = this.search.toLowerCase().trim();
      if (!q) return codes;
      return codes.filter(c => this.langName(c).toLowerCase().includes(q) || DATA.languages[c].name.toLowerCase().includes(q));
    },

    toggleSpeaker(code) {
      const i = this.speakers.indexOf(code);
      if (i >= 0) this.speakers.splice(i, 1);
      else this.speakers.push(code);
    },

    resetWeights() { this.weights = {...DEFAULT_WEIGHTS}; },

    // ====== SCORING (port of similarity.py) ======

    k(a,b) { return a < b ? a+'|'+b : b+'|'+a; },

    lexicalSimilarity(a,b) {
      if (a===b) return 1.0;
      const key = this.k(a,b);
      if (DATA.lexical[key] !== undefined) return DATA.lexical[key];
      const la = DATA.languages[a], lb = DATA.languages[b];
      if (la.family !== lb.family) return 0.03;
      if (la.branch !== lb.branch) return 0.10;
      if (la.subbranch !== lb.subbranch) return 0.30;
      return 0.55;
    },

    genealogical(a,b) {
      const la = DATA.languages[a], lb = DATA.languages[b];
      if (la.family !== lb.family) return 0.0;
      if (la.branch !== lb.branch) return 0.4;
      if (la.subbranch !== lb.subbranch) return 0.7;
      return 1.0;
    },

    wordOrderSim(la,lb) {
      const fam = {
        'SVO': ['SVO'],
        'V2': ['V2','SVO'],
        'SOV': ['SOV'],
        'VSO': ['VSO'],
        'SVO(free)': ['SVO(free)','SVO'],
        'SOV(free)': ['SOV(free)','SOV'],
        'topic-focus(free)': ['topic-focus(free)','SVO(free)','SVO'],
      };
      if (la.word_order === lb.word_order) return 1.0;
      if ((fam[la.word_order]||[]).includes(lb.word_order)) return 0.7;
      if ((fam[lb.word_order]||[]).includes(la.word_order)) return 0.7;
      return 0.0;
    },

    morphSim(la,lb) {
      if (la.morphology === lb.morphology) return 1.0;
      const pairs = {
        'analytic|analytic-fusional': 0.8,
        'fusional|analytic-fusional': 0.8,
        'analytic|fusional': 0.3,
        'fusional|agglutinative': 0.2,
        'analytic|agglutinative': 0.1,
        'analytic-fusional|agglutinative': 0.15,
        'analytic|analytic-agglutinative': 0.4,
        'agglutinative|analytic-agglutinative': 0.6,
      };
      const key = [la.morphology, lb.morphology].sort().join('|');
      return pairs[key] || 0.0;
    },

    grammatical(a,b) {
      const la = DATA.languages[a], lb = DATA.languages[b];
      const caseDiff = Math.abs(la.case_count - lb.case_count);
      const caseScore = Math.max(0, 1 - caseDiff/8);
      const genderDiff = Math.abs(la.gender_count - lb.gender_count);
      const genderScore = Math.max(0, 1 - genderDiff/3);
      let artScore;
      if (la.articles === lb.articles) artScore = 1.0;
      else if (la.articles !== 'none' && lb.articles !== 'none') artScore = 0.5;
      else artScore = 0.2;
      const wordScore = this.wordOrderSim(la,lb);
      const morphScore = this.morphSim(la,lb);
      const vhScore = (la.vowel_harmony === lb.vowel_harmony) ? 1.0 : 0.0;
      return (caseScore + genderScore + artScore + wordScore + morphScore + vhScore) / 6;
    },

    phonological(a,b) {
      const pa = new Set(DATA.languages[a].phoneme_features);
      const pb = new Set(DATA.languages[b].phoneme_features);
      if (pa.size === 0 && pb.size === 0) return 1.0;
      let inter = 0;
      for (const x of pa) if (pb.has(x)) inter++;
      const union = pa.size + pb.size - inter;
      return union === 0 ? 0 : inter / union;
    },

    writingSystem(a,b) {
      const sa = DATA.languages[a].writing_system, sb = DATA.languages[b].writing_system;
      if (sa === sb) return 1.0;
      if (sa.includes('Latin') && sb.includes('Latin')) return 1.0;
      if (sa.includes('Cyrillic') && sb.includes('Cyrillic')) return 1.0;
      if (sa.includes('Arabic') && sb.includes('Arabic')) return 1.0;
      return 0.0;
    },

    contactBonus(h,t) {
      const info = DATA.contact[h+'|'+t];
      return info ? [info.bonus, info.note] : [0, null];
    },

    combinedScore(target) {
      const dims = ['genealogical','lexical','grammatical','phonological','writing_system'];
      const best = {}; const helpers = {};
      for (const d of dims) { best[d] = 0; helpers[d] = null; }
      const notes = [];
      let totalBonus = 0;

      for (const h of this.speakers) {
        const sub = {
          genealogical: this.genealogical(h, target),
          lexical: this.lexicalSimilarity(h, target),
          grammatical: this.grammatical(h, target),
          phonological: this.phonological(h, target),
          writing_system: this.writingSystem(h, target),
        };
        for (const d of dims) {
          if (sub[d] > best[d]) { best[d] = sub[d]; helpers[d] = h; }
        }
        const [b, n] = this.contactBonus(h, target);
        if (b) { totalBonus += b; notes.push({helper: h, note: n}); }
      }

      const lexWithBonus = Math.min(1.0, best.lexical + totalBonus);
      const totalW = Object.values(this.weights).reduce((a,b)=>a+b, 0) || 1;
      const w = {};
      for (const k of Object.keys(this.weights)) w[k] = this.weights[k] / totalW;
      const total =
        best.genealogical * w.genealogical +
        lexWithBonus * w.lexical +
        best.grammatical * w.grammatical +
        best.phonological * w.phonological +
        best.writing_system * w.writing_system;

      return {
        target, total,
        sub_scores: best,
        helpers_per_dim: helpers,
        lexical_with_contact_bonus: lexWithBonus,
        contact_bonus: totalBonus,
        contact_notes: notes,
      };
    },

    get recommendations() {
      if (this.speakers.length === 0) return [];
      const candidates = Object.keys(DATA.languages).filter(c => !this.speakers.includes(c));
      const scored = candidates.map(t => this.combinedScore(t));
      scored.sort((a,b) => b.total - a.total);
      return scored.slice(0, this.topN);
    },

    // ====== EXPLANATION GENERATOR ======

    explain(rec) {
      const targetName = DATA.languages[rec.target].name;
      const hpd = rec.helpers_per_dim;
      const helperName = h => h ? DATA.languages[h].name : '—';
      const s = rec.sub_scores;
      const parts = [];

      const genH = helperName(hpd.genealogical);
      if (s.genealogical === 1.0) parts.push(this.t('expSameSubbranch', {target: targetName, helper: genH}));
      else if (s.genealogical >= 0.7) parts.push(this.t('expSameBranch', {target: targetName, helper: genH}));
      else if (s.genealogical >= 0.4) {
        const fam = DATA.languages[rec.target].family;
        parts.push(this.t('expSameFamily', {target: targetName, helper: genH, family: fam}));
      } else parts.push(this.t('expUnrelated', {target: targetName}));

      const lex = rec.lexical_with_contact_bonus;
      const lexH = helperName(hpd.lexical);
      const pct = Math.round(lex*100);
      if (lex >= 0.7) parts.push(this.t('expLexVeryHigh', {helper: lexH, pct}));
      else if (lex >= 0.4) parts.push(this.t('expLexHigh', {helper: lexH, pct}));
      else if (lex >= 0.2) parts.push(this.t('expLexModest', {pct}));
      else parts.push(this.t('expLexLow', {pct}));

      for (const n of rec.contact_notes) parts.push(n.note);

      const g = s.grammatical;
      const gH = helperName(hpd.grammatical);
      if (g >= 0.75) parts.push(this.t('expGramSimilar', {helper: gH}));
      else if (g >= 0.55) parts.push(this.t('expGramOverlap', {helper: gH}));
      else if (g >= 0.35) parts.push(this.t('expGramDiff'));
      else parts.push(this.t('expGramVeryDiff'));

      if (s.writing_system < 1.0) {
        if (s.writing_system === 0.0) parts.push(this.t('expScriptNew'));
        else parts.push(this.t('expScriptPartial'));
      }
      if (s.phonological >= 0.5) parts.push(this.t('expPhonSimilar'));
      else if (s.phonological < 0.1) parts.push(this.t('expPhonDiff'));

      return parts.join(' ');
    },

    formatSub(rec, key) {
      const v = key === 'lexical' ? rec.lexical_with_contact_bonus : rec.sub_scores[key];
      return v.toFixed(2);
    },

    radarSvg(rec) {
      const dims = ['lexical','grammatical','phonological','writing_system','genealogical'];
      const labels = ['Lex','Gram','Phon','Script','Family'];
      const cx = 64, cy = 64, R = 48;
      const points = dims.map((d, i) => {
        const v = d === 'lexical' ? rec.lexical_with_contact_bonus : rec.sub_scores[d];
        const angle = (Math.PI*2 * i / dims.length) - Math.PI/2;
        const r = R * v;
        return [cx + Math.cos(angle)*r, cy + Math.sin(angle)*r];
      });
      const polygon = points.map(p => p.join(',')).join(' ');
      const axes = dims.map((_, i) => {
        const angle = (Math.PI*2 * i / dims.length) - Math.PI/2;
        const x = cx + Math.cos(angle)*R;
        const y = cy + Math.sin(angle)*R;
        return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--radar-grid)" stroke-width="0.5"/>`;
      }).join('');
      const labelEls = labels.map((label, i) => {
        const angle = (Math.PI*2 * i / dims.length) - Math.PI/2;
        const x = cx + Math.cos(angle)*(R+10);
        const y = cy + Math.sin(angle)*(R+10);
        return `<text x="${x}" y="${y}" font-size="8" fill="var(--radar-label)" text-anchor="middle" dominant-baseline="middle">${label}</text>`;
      }).join('');
      return `<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--radar-grid)" stroke-width="0.5"/>
        <circle cx="${cx}" cy="${cy}" r="${R*0.66}" fill="none" stroke="var(--radar-grid)" stroke-width="0.3"/>
        <circle cx="${cx}" cy="${cy}" r="${R*0.33}" fill="none" stroke="var(--radar-grid)" stroke-width="0.3"/>
        ${axes}
        <polygon points="${polygon}" fill="var(--radar-fill)" fill-opacity="0.25" stroke="var(--radar-fill)" stroke-width="1"/>
        ${labelEls}
      </svg>`;
    },
  };
}
</script>
